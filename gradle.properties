# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process.
# Tweak memory settings to prevent GC bottlenecks during Compose / AGP / Chaquopy compilation.
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Enables parallel execution of independent tasks across modules/subprojects.
org.gradle.parallel=true

# Enables the build cache so unchanged task outputs are reused between builds.
org.gradle.caching=true

# Enables the Configuration Cache to skip the configuration phase when scripts haven't changed.
org.gradle.configuration-cache=true

# Enables incremental compilation for Kotlin code.
kotlin.incremental=true

# Kotlin code style for this project:
kotlin.code.style=official
